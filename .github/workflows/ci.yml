name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  model-free:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm assets:manifest
      - run: pnpm licenses:runtime
      - run: pnpm source:guard:index
      - run: pnpm source:guard:self-test
      - run: pnpm build:code

  native-package:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cmake --version
      - run: pnpm package:mac:unsigned
      - run: codesign --verify --deep --strict "release/mac-arm64/Locomo Music OSS.app"
      - run: pnpm verify:package:mac
