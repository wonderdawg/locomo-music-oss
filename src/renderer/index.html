    <style id="locomo-startup-ghost-styles">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #cde50b;
      }

      #locomo-startup-ghost {
        position: fixed;
        inset: 0;
        z-index: 2147483600;
        overflow: hidden;
        background: #cde50b;
        color: #191919;
        -webkit-app-region: drag;
        pointer-events: none;
        user-select: none;
      }

      #locomo-startup-ghost,
      #locomo-startup-ghost * {
        box-sizing: border-box;
      }

      .startup-ghost__symbols {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      .startup-ghost__chrome {
        display: flex;
        height: 38px;
        align-items: center;
        justify-content: center;
      }

      .startup-ghost__wordmark,
      .startup-ghost__heading-bar,
      .startup-ghost__badge,
      .startup-ghost__label {
        display: block;
        border-radius: 999px;
        background: rgb(25 25 25 / 18%);
      }

      .startup-ghost__wordmark {
        width: 78px;
        height: 8px;
      }

      .startup-ghost__pane {
        position: absolute;
        top: 38px;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-rows: 32fr 38.4fr 24fr 815.6fr 24fr;
        padding-inline: 2.9126213592vw;
      }

      .startup-ghost__heading {
        display: flex;
        grid-row: 2;
        align-items: center;
      }

      .startup-ghost__heading-bar {
        width: 24%;
        height: 37.5%;
      }

      .startup-ghost__grid {
        display: grid;
        grid-row: 4;
        grid-template-columns: repeat(20, minmax(0, 1fr));
        grid-template-rows:
          repeat(2, minmax(0, 196fr))
          repeat(3, minmax(0, 130.5fr));
        gap: 1.0309278351%;
      }

      .startup-ghost__card {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgb(25 25 25 / 22%);
        border-radius: 1.4563106796vw;
        background: rgb(25 25 25 / 2.5%);
      }

      .startup-ghost__card[data-startup-card="featured"] {
        grid-column: span 10;
      }

      .startup-ghost__card[data-startup-card="standard"] {
        grid-column: span 4;
      }

      .startup-ghost__art {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        opacity: 0.11;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .startup-ghost__art--74 {
        width: 74%;
        height: 74%;
      }

      .startup-ghost__art--70 {
        width: 70%;
        height: 70%;
      }

      .startup-ghost__art--68 {
        width: 68%;
        height: 68%;
      }

      .startup-ghost__badge {
        position: absolute;
        top: 0.7281553398vw;
        right: 0.7281553398vw;
        width: 3.640776699vw;
        height: 1.213592233vw;
      }

      .startup-ghost__label {
        position: absolute;
        bottom: 1.213592233vw;
        left: 1.213592233vw;
      }

      .startup-ghost__card[data-startup-card="featured"]
        .startup-ghost__label {
        width: 42%;
        height: 1.4563106796vw;
      }

      .startup-ghost__card[data-startup-card="standard"]
        .startup-ghost__label {
        width: 54%;
        height: 0.7281553398vw;
      }
